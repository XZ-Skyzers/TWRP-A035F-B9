name: Build TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential ccache curl git gperf libxml2-utils make zip libssl-dev python3 python-is-python3

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP Source
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "Skyzers"
        git config --global user.email "skyzers@example.com"
        ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
        ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd workspace
        git clone ${{ github.server_url }}/${{ github.repository }} device/samsung/a03

    - name: Fix Missing Headers & Build Recovery
      run: |
        cd workspace
        export PATH=~/bin:$PATH
        source build/envsetup.sh

        # Pembersihan VTS & penanganan masalah dependensi Soong
        rm -rf hardware/interfaces/vts
        rm -rf test/vts
        find hardware/interfaces/ -type f -name "Android.bp" -exec grep -l "vts" {} + | xargs rm -f || true
        find vendor/qcom/opensource/interfaces/ -type f -name "Android.bp" -exec grep -l "vts" {} + | xargs rm -f || true

        # Perbaikan missing header android_filesystem_config.h untuk libcutils
        mkdir -p system/core/libcutils/include/private
        if [ -f system/core/include/private/android_filesystem_config.h ]; then
          cp system/core/include/private/android_filesystem_config.h system/core/libcutils/include/private/
        elif [ -f system/media/audio/include/system/audio.h ]; then
          mkdir -p system/core/libcutils/include/system
        fi

        lunch twrp_a03-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v7
      with:
        name: TWRP_Galaxy_A03
        path: workspace/out/target/product/a03/recovery.img
